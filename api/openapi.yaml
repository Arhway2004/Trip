openapi: 3.0.3
info:
  title: WanderPlan API
  version: 0.1.0
  description: |
    Backend for the WanderPlan app. JSON field names match the app's trip file
    format (docs/IMPORT_FORMAT.md). Errors use RFC 9457 problem details.
    Writes use optimistic concurrency: send `If-Match` with the ETag you read.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      summary: Liveness probe
      security: []
      responses:
        "200": { description: Alive }
  /readyz:
    get:
      summary: Readiness probe (checks the database)
      security: []
      responses:
        "200": { description: Ready }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/me:
    get:
      summary: The signed-in user (created on first sign-in)
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Problem" }
  /v1/trips:
    get:
      summary: Trips the user is a member of
      parameters:
        - in: query
          name: includeArchived
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Trips
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Trip" }
        "401": { $ref: "#/components/responses/Problem" }
    post:
      summary: Create a trip (idempotent when the client supplies `id`)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TripInput" }
      responses:
        "201":
          description: Created
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Trip" }
        "200":
          description: Already existed (retry of an earlier create)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Trip" }
        "400": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /v1/trips/import:
    post:
      summary: Import mobile JSON or a .wanderplan ZIP as a new independent trip
      description: Maximum 20 MB upload, 20 MB expanded, 5 MB JSON document. Validated before saving. Retains the full mobile document and media as a read-only snapshot.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "201":
          description: Imported
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Trip" }
        "401": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /v1/trips/{tripId}/import:
    parameters:
      - $ref: "#/components/parameters/TripId"
    get:
      summary: Read the original imported planning data and media (members only)
      responses:
        "200":
          description: The imported snapshot, or null for a trip created without import
          content:
            application/json:
              schema:
                nullable: true
                allOf:
                  - $ref: "#/components/schemas/ImportedPackage"
        "404": { $ref: "#/components/responses/Problem" }
  /v1/trips/{tripId}/plan:
    parameters:
      - $ref: "#/components/parameters/TripId"
    get:
      summary: Editable plan, initialized from the original import or an empty plan
      responses:
        "200":
          description: Current plan with its independent version (zero before the first save)
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TripPlan" }
        "404": { $ref: "#/components/responses/Problem" }
    put:
      summary: Save all planning sections and media atomically (owner or editor)
      description: Maximum 32 MB request including base64; document and decoded media together must fit 20 MB. Trip metadata is edited separately. The original import remains unchanged.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportedPackage" }
      responses:
        "200":
          description: Saved plan and new version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TripPlan" }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "428": { $ref: "#/components/responses/Problem" }
  /v1/trips/{tripId}/export:
    parameters:
      - $ref: "#/components/parameters/TripId"
    get:
      summary: Export the current plan, current trip details and all media for mobile import
      responses:
        "200":
          description: Mobile-compatible .wanderplan ZIP
          content:
            application/zip:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/trips/{tripId}:
    parameters:
      - $ref: "#/components/parameters/TripId"
    get:
      summary: One trip
      parameters:
        - in: header
          name: If-None-Match
          schema: { type: string }
      responses:
        "200":
          description: Trip
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Trip" }
        "304": { description: Not modified }
        "404": { $ref: "#/components/responses/Problem" }
    put:
      summary: Replace the trip's editable fields (owner or editor)
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TripInput" }
      responses:
        "200":
          description: Updated
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Trip" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "428": { $ref: "#/components/responses/Problem" }
    delete:
      summary: Delete the trip (owner only)
      parameters:
        - in: header
          name: If-Match
          required: false
          schema: { type: string }
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
  /v1/trips/{tripId}/members:
    parameters:
      - $ref: "#/components/parameters/TripId"
    get:
      summary: Members of a trip and their roles
      responses:
        "200":
          description: Members
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Member" }
        "404": { $ref: "#/components/responses/Problem" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    TripId:
      in: path
      name: tripId
      required: true
      schema: { type: string, format: uuid }
    IfMatch:
      in: header
      name: If-Match
      required: true
      description: The ETag from your last read; prevents lost updates.
      schema: { type: string, example: '"3"' }
  headers:
    ETag:
      description: Trip version, e.g. "3"
      schema: { type: string }
  responses:
    Problem:
      description: Error (RFC 9457)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    TripPlan:
      allOf:
        - $ref: "#/components/schemas/ImportedPackage"
        - type: object
          required: [version]
          properties:
            version: { type: integer, format: int64, minimum: 0 }
    ImportedPackage:
      type: object
      required: [document, media]
      properties:
        document:
          type: object
          additionalProperties: true
        media:
          type: object
          additionalProperties:
            type: string
            format: byte
    User:
      type: object
      required: [id, createdAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        displayName: { type: string }
        createdAt: { type: string, format: date-time }
    TripInput:
      type: object
      required: [title]
      properties:
        id: { type: string, format: uuid, description: Client-generated ID (makes create idempotent) }
        title: { type: string, maxLength: 200 }
        description: { type: string, nullable: true }
        startDate: { type: string, format: date, nullable: true }
        endDate: { type: string, format: date, nullable: true }
        departureTime: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', nullable: true }
        datesConfirmed: { type: boolean }
        timeZone: { type: string, example: Asia/Shanghai, description: IANA zone; defaults to UTC }
        travelerCount: { type: integer, minimum: 1, maximum: 999 }
        currency: { type: string, pattern: '^[A-Z]{3}$', nullable: true }
        totalBudget: { type: number, minimum: 0, nullable: true, description: Requires currency }
        travelStyle:
          type: string
          nullable: true
          enum: [relaxed, balanced, packed, budget, comfort, luxury, adventure, family]
        stage: { type: string, enum: [dreaming, planning] }
        archived: { type: boolean }
    Trip:
      allOf:
        - $ref: "#/components/schemas/TripInput"
        - type: object
          required: [id, ownerId, role, version, createdAt, updatedAt]
          properties:
            id: { type: string, format: uuid }
            ownerId: { type: string, format: uuid }
            role: { type: string, enum: [owner, editor, viewer] }
            version: { type: integer, format: int64 }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    Member:
      type: object
      required: [userId, role, createdAt]
      properties:
        userId: { type: string, format: uuid }
        role: { type: string, enum: [owner, editor, viewer] }
        createdAt: { type: string, format: date-time }
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code: { type: string, example: trip.version_mismatch }
        requestId: { type: string }
        errors:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }
